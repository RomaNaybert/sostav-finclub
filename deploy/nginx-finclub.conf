# Include inside roman-naipert.com HTTPS server block.
location = /finclub { return 308 /finclub/; }
location ^~ /finclub/api/ {
    proxy_pass http://127.0.0.1:8181/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 128k;
}
location ^~ /finclub/assets/ {
    root /opt/sostav/current/web;
    try_files $uri =404;
    expires 1h;
    add_header X-Content-Type-Options nosniff always;
}
location /finclub/ {
    root /opt/sostav/current/web;
    try_files $uri $uri/ /finclub/index.html;
    add_header Cache-Control no-cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self' https://web.telegram.org; base-uri 'self'; form-action 'self'" always;
}
